<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LA Project — Генеральный Lookbook и Портфолио 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── СБРОС И ОСНОВНЫЕ СТИЛИ ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #07080a;
      --surface: #0e1014;
      --card-bg: #14171d;
      --card-border: rgba(212, 182, 142, 0.22);
      --accent: #d4b68e;
      --accent-light: #f1dfc5;
      --text: #f0f2f5;
      --text-muted: #8f96a3;
      --text-dim: #5c6270;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #030405;
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    /* ── ВЕРХНЯЯ ПАНЕЛЬ УПРАВЛЕНИЯ (ТОЛЬКО НА ЭКРАНЕ) ── */
    .lb-toolbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 8, 10, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(212, 182, 142, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 32px;
      gap: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
    }

    .lb-toolbar-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text);
    }

    .lb-toolbar-logo {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .lb-toolbar-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      background: rgba(212, 182, 142, 0.12);
      border: 1px solid rgba(212, 182, 142, 0.3);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .lb-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lb-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
    }

    .lb-btn-gold {
      background: var(--accent);
      color: #07080a;
      border: 1px solid var(--accent);
      font-weight: 600;
    }

    .lb-btn-gold:hover {
      background: var(--accent-light);
      border-color: var(--accent-light);
      transform: translateY(-1px);
    }

    .lb-btn-line {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .lb-btn-line:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lb-lang-group {
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      overflow: hidden;
    }

    .lb-lang-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lb-lang-btn.active {
      background: var(--accent);
      color: #07080a;
    }

    /* ── КОНТЕЙНЕР СТРАНИЦ ── */
    .pages-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 40px 20px 80px;
    }

    /* ── СТАНДАРТНАЯ СТРАНИЦА A4 LANDSCAPE (297mm x 210mm) ── */
    .page {
      width: 297mm;
      height: 210mm;
      max-width: 100%;
      background-color: var(--bg);
      border: 1px solid rgba(212, 182, 142, 0.25);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 22mm 24mm 16mm;
      page-break-after: always;
      break-after: page;
    }

    /* ── СТРАНИЦА 1: ОБЛОЖКА ── */
    .page-cover {
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background: #07080a;
    }

    .cover-bg-wrap {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .cover-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.38;
      filter: saturate(0.85) contrast(1.1);
    }

    .cover-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 75% 35%, rgba(7,8,10,0.2) 0%, rgba(7,8,10,0.85) 60%, #07080a 100%),
                  linear-gradient(to top, #07080a 0%, rgba(7,8,10,0.6) 40%, rgba(7,8,10,0.4) 100%);
    }

    .cover-border-frame {
      position: absolute;
      inset: 12mm;
      border: 1px solid rgba(212, 182, 142, 0.3);
      pointer-events: none;
      z-index: 3;
    }

    .cover-content {
      position: relative;
      z-index: 4;
      height: 100%;
      padding: 22mm 24mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cover-brand {
      font-family: var(--font-serif);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .cover-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      border: 1px solid rgba(212, 182, 142, 0.4);
      padding: 6px 14px;
      background: rgba(7, 8, 10, 0.6);
      backdrop-filter: blur(8px);
    }

    .cover-middle {
      max-width: 680px;
    }

    .cover-eyebrow {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .cover-title {
      font-family: var(--font-serif);
      font-size: 52px;
      font-weight: 400;
      line-height: 1.08;
      color: #ffffff;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }

    .cover-title span {
      color: var(--accent);
      font-style: italic;
    }

    .cover-subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: #c4c8d0;
      font-weight: 300;
      max-width: 580px;
    }

    .cover-bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-top: 1px solid rgba(212, 182, 142, 0.25);
      padding-top: 14px;
    }

    .cover-meta-item {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .cover-meta-item strong {
      color: var(--accent);
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    /* ── СТРАНИЦА 2: О БЮРО И МАНИФЕСТ ── */
    .about-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 32px;
      height: 100%;
      align-items: stretch;
    }

    .about-author-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .about-photo {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border: 1px solid var(--card-border);
      filter: grayscale(15%) contrast(1.05);
    }

    .about-author-name {
      font-family: var(--font-serif);
      font-size: 20px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .about-author-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .about-info-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .about-quote {
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.4;
      font-style: italic;
      color: var(--accent-light);
      border-left: 2px solid var(--accent);
      padding-left: 18px;
      margin-bottom: 12px;
    }

    .about-text {
      font-size: 11.5px;
      line-height: 1.6;
      color: #cbd1db;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .about-services-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 6px;
    }

    .about-svc-card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 182, 142, 0.15);
      padding: 10px 12px;
      border-radius: 4px;
    }

    .about-svc-num {
      font-size: 10px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 2px;
    }

    .about-svc-name {
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .about-svc-desc {
      font-size: 10px;
      line-height: 1.4;
      color: var(--text-muted);
    }

    .about-stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      border-top: 1px solid rgba(212, 182, 142, 0.2);
      padding-top: 12px;
      margin-top: 10px;
    }

    .about-stat-item strong {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--accent);
      display: block;
      line-height: 1;
    }

    .about-stat-item span {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── СТРАНИЦА РАЗДЕЛИТЕЛЬ КАТЕГОРИИ ── */
    .page-divider {
      background: #090b0f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .divider-num {
      font-family: var(--font-serif);
      font-size: 140px;
      line-height: 1;
      color: rgba(212, 182, 142, 0.06);
      position: absolute;
      font-weight: 700;
      letter-spacing: 0.1em;
      user-select: none;
    }

    .divider-eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--accent);
      margin-bottom: 12px;
      font-weight: 600;
      position: relative;
      z-index: 2;
    }

    .divider-title {
      font-family: var(--font-serif);
      font-size: 44px;
      color: #ffffff;
      font-weight: 400;
      letter-spacing: 0.04em;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .divider-sub {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.6;
      position: relative;
      z-index: 2;
    }

    .divider-line {
      width: 60px;
      height: 1px;
      background: var(--accent);
      margin: 20px auto 0;
      position: relative;
      z-index: 2;
    }

    /* ── СТРАНИЦА ПРОЕКТА ── */
    .project-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid rgba(212, 182, 142, 0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .project-header-left {
      max-width: 68%;
    }

    .project-tags-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .project-tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      font-weight: 600;
    }

    .project-status {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 2px 6px;
      border-radius: 2px;
      background: rgba(212, 182, 142, 0.12);
      border: 1px solid rgba(212, 182, 142, 0.28);
      color: var(--accent-light);
    }

    .project-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.15;
      letter-spacing: 0.02em;
    }

    .project-header-right {
      text-align: right;
    }

    .project-location {
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .project-body {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    /* Визуальная часть */
    .project-visuals {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .project-main-img-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--card-border);
      border-radius: 3px;
      background: #000;
    }

    .project-main-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-gallery-thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      height: 68px;
    }

    .project-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 1px solid rgba(212, 182, 142, 0.15);
      border-radius: 2px;
    }

    /* Описание и спецификации */
    .project-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .project-desc-wrap {
      margin-bottom: 10px;
    }

    .project-desc-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--accent);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .project-desc {
      font-size: 11px;
      line-height: 1.55;
      color: #cbd1db;
      font-weight: 300;
      text-align: justify;
    }

    .project-facts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      background: var(--surface);
      border: 1px solid rgba(212, 182, 142, 0.16);
      padding: 10px 12px;
      border-radius: 4px;
    }

    .fact-item {
      display: flex;
      flex-direction: column;
    }

    .fact-key {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .fact-val {
      font-size: 11px;
      color: #ffffff;
      font-weight: 500;
    }

    /* ── ФУТЕР СТРАНИЦЫ ── */
    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(212, 182, 142, 0.18);
      padding-top: 8px;
      margin-top: 10px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--text-dim);
    }

    .footer-brand {
      color: var(--accent);
      font-weight: 600;
    }

    .footer-pagenum {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ── ФИНАЛЬНАЯ СТРАНИЦА: КОНТАКТЫ ── */
    .contacts-page-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 36px;
      height: 100%;
      align-items: center;
    }

    .contacts-left {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contacts-eyebrow {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--accent);
      font-weight: 600;
    }

    .contacts-title {
      font-family: var(--font-serif);
      font-size: 38px;
      line-height: 1.12;
      color: #ffffff;
      font-weight: 400;
    }

    .contacts-title span {
      color: var(--accent);
      font-style: italic;
    }

    .contacts-desc {
      font-size: 12px;
      line-height: 1.6;
      color: #b0b7c3;
      font-weight: 300;
    }

    .contacts-items-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .c-row {
      display: flex;
      flex-direction: column;
    }

    .c-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .c-val {
      font-size: 14px;
      color: #ffffff;
      font-weight: 500;
    }

    .c-val a {
      color: #ffffff;
      text-decoration: none;
    }

    .contacts-right-card {
      background: var(--surface);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .contacts-card-title {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--accent);
      font-weight: 600;
    }

    .contacts-card-text {
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--text-muted);
    }

    .contacts-lic-box {
      border-top: 1px solid rgba(212, 182, 142, 0.2);
      padding-top: 14px;
      font-size: 10px;
      color: var(--accent-light);
      letter-spacing: 0.08em;
      line-height: 1.5;
    }

    /* ── МОБИЛЬНАЯ АДАПТАЦИЯ ЭКРАНА LOOKBOOK ── */
    @media screen and (max-width: 960px) {
      .lb-toolbar {
        padding: 10px 16px;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
      }
      .lb-toolbar-brand {
        justify-content: space-between;
      }
      .lb-toolbar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: space-between;
      }
      .lb-lang-group {
        flex: 1 1 auto;
        justify-content: center;
      }
      .lb-lang-btn {
        flex: 1;
        text-align: center;
        padding: 8px 10px;
      }
      .lb-btn {
        flex: 1 1 calc(50% - 6px);
        justify-content: center;
        padding: 8px 10px;
        font-size: 11px;
        min-height: 40px;
      }
      .pages-container {
        padding: 16px 12px 64px;
        gap: 20px;
        width: 100%;
        max-width: 760px;
      }
      .page {
        width: 100%;
        height: auto;
        min-height: auto;
        padding: 24px 18px 16px;
        border-radius: 8px;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7);
        page-break-after: auto;
        break-after: auto;
      }
      .page-cover {
        padding: 0;
        min-height: 540px;
      }
      .cover-border-frame {
        inset: 10px;
      }
      .cover-content {
        padding: 24px 18px;
        gap: 24px;
      }
      .cover-title {
        font-size: 32px;
        line-height: 1.15;
      }
      .cover-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .cover-meta-item[style*="text-align: right"] {
        text-align: left !important;
      }
      .about-layout {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .about-photo {
        height: 260px;
      }
      .about-services-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .about-stats-row {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .divider-title {
        font-size: 32px;
      }
      .divider-num {
        font-size: 80px;
      }
      .project-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .project-header-left {
        max-width: 100%;
      }
      .project-header-right {
        text-align: left;
      }
      .project-title {
        font-size: 20px;
      }
      .project-body {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .project-visuals {
        gap: 8px;
      }
      .project-main-img-wrap {
        height: 240px;
      }
      .project-gallery-thumbs {
        height: 64px;
      }
      .project-facts-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;

                    <span class="project-status">${p.status}</span>

                  <h2 class="project-title">${p.title}</h2>
                </div>
                <div class="project-header-right">
                  <div class="project-location">${p.place}</div>
                </div>
              </div>

              <div class="project-body">
                <div class="project-visuals">
                  <div class="project-main-img-wrap">
                    <img src="${mainImg}" alt="${p.title}" class="project-main-img" onerror="this.src='img/${p.slug}/00.jpg'">
                  </div>
                  ${thumbsHtml}
                </div>

                <div class="project-details">
                  <div class="project-desc-wrap">
                    <div class="project-desc-label">${t.descLabel}</div>
                    <p class="project-desc">${p.desc}</p>
                  </div>
                  <div class="project-specs-wrap">
                    <div class="project-desc-label" style="margin-bottom: 6px;">${t.specLabel}</div>
                    <div class="project-facts-grid">
                      ${factsHtml}
                    </div>
                  </div>
                </div>
              </div>

              <div class="page-footer">
                <span class="footer-brand">LA PROJECT · ${p.tag.toUpperCase()}</span>
                <span class="footer-pagenum">${String(pageIdx).padStart(2, '0')} / ${totalPages}</span>
              </div>
            </div>
          `;
          pageIdx++;
        });

        // ── СТРАНИЦА ФИНАЛЬНАЯ: КОНТАКТЫ ──
        html += `
          <div class="page">
            <div class="contacts-page-layout">
              <div class="contacts-left">
                <div class="contacts-eyebrow">${t.contactEyebrow}</div>
                <h2 class="contacts-title">${t.contactTitle}</h2>
                <p class="contacts-desc">${t.contactDesc}</p>
                <div class="contacts-items-list">
                  <div class="c-row">
                    <span class="c-label">${t.cPhone}</span>
                    <span class="c-val"><a href="tel:+77017864680">+7 (701) 786-46-80</a> / <a href="tel:+77017864688">+7 (701) 786-46-88</a></span>
                  </div>
                  <div class="c-row">
                    <span class="c-label">${t.cEmail}</span>
                    <span class="c-val"><a href="mailto:info@laproject.kz">info@laproject.kz</a></span>
                  </div>
                  <div class="c-row">
                    <span class="c-label">${t.cAddress}</span>
                    <span class="c-val">${t.cAddressVal}</span>
                  </div>
                </div>
              </div>
              <div class="contacts-right-card">
                <div class="contacts-card-title">${t.cardTitle}</div>
                <div class="contacts-card-text">${t.cardText}</div>
                <div style="margin: 10px 0;">
                  <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--accent); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 4px; display: inline-block;">
                    la-project.kz
                  </span>
                </div>
                <div class="contacts-lic-box">${t.cardLic}</div>
              </div>
            </div>
            <div class="page-footer">
              <span class="footer-brand">LA PROJECT · CONTACTS</span>
              <span class="footer-pagenum">${totalPages} / ${totalPages}</span>
            </div>
          </div>
        `;

        container.innerHTML = html;
        window.__LOOKBOOK_READY__ = true;
      }

      // Слушатели кнопок языка
      document.querySelectorAll('.lb-lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.lb-lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentLang = btn.dataset.lang;
          localStorage.setItem('la_lang', currentLang);
          renderLookbook(currentLang);
        });
      });

      // Инициализация активной кнопки языка
      const activeBtn = document.querySelector(`.lb-lang-btn[data-lang="${currentLang}"]`);
      if (activeBtn) {
        document.querySelectorAll('.lb-lang-btn').forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
      }

      // Рендерим при загрузке
      renderLookbook(currentLang);
    })();
  </script>
</body>
</html>
